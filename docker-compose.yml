services:
  optic:
    build: .
    image: optic:latest
    ports:
      - "3000:3000"
    environment:
      # Set to false after creating your account to stop strangers signing up.
      OPTIC_ALLOW_SIGNUP: ${OPTIC_ALLOW_SIGNUP:-true}
      # Set to 1 to load the Northwind Coffee demo data on first start.
      OPTIC_SEED_DEMO: ${OPTIC_SEED_DEMO:-0}
    volumes:
      - optic-data:/data
    restart: unless-stopped

volumes:
  optic-data:
