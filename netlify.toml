# Netlify detects Next.js and runs it on its own runtime; the database is Turso, because
# functions have no disk that lasts. Set TURSO_DATABASE_URL and TURSO_AUTH_TOKEN in the site's
# environment variables.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
